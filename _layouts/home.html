<!-- Full-bleed hero: background image is set from site.hero_image in _config.yml -->

    <p class="hero-eyebrow">ASDAH</p>
    <h1>Association of Seventh-day Adventist Historians</h1>

    <div class="btn-group">
      <a href="{{ '/about/' | relative_url }}" class="btn btn-primary">About Us</a>
      <a href="{{ '/research/' | relative_url }}" class="btn btn-secondary">Our Research</a>
    </div>
  </div>
</section>

<main class="page-content">
  {{ content }}
</main>
